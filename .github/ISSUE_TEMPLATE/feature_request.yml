name: 功能建议
description: 提出具体使用场景或改进方案
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述实际场景以及目前遇到的限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方法或补充说明
